name: 1Password Connection Diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
    paths:
      - '.github/workflows/composio-1password-sync.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        env:
          COMPOSIO_INSTALL_VERSION: '0.4.1'
          COMPOSIO_INSTALL_PLUGINS: '0'
          COMPOSIO_INSTALL_SHELL: none
          COMPOSIO_INSTALL_HELP: '0'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            https://composio.dev/install --output "$RUNNER_TEMP/composio-install.sh"
          sh "$RUNNER_TEMP/composio-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/composio" --version

      - name: Verify pinned CLI commands without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(composio --version)" = '0.4.1'
          composio dev connected-accounts list --help
          composio tools list --help

      - name: Require Composio API key for live diagnostics
        if: github.event_name != 'pull_request'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSIO_API_KEY:-}" ]; then
            echo '::error::COMPOSIO_API_KEY is not configured. Live 1Password diagnostics cannot run.'
            exit 1
          fi

      - name: Composio Whoami
        if: github.event_name != 'pull_request'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: composio whoami > "$RUNNER_TEMP/composio-identity.json"

      - name: List Connected Accounts
        if: github.event_name != 'pull_request'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: composio dev connected-accounts list --toolkits _1password --status ACTIVE --limit 10 > "$RUNNER_TEMP/composio-accounts.json"

      - name: 1Password Tools Status
        if: github.event_name != 'pull_request'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: composio tools list _1password --limit 10

      - name: Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo 'Pinned CLI installation and command syntax verified. Authenticated diagnostics were not run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Composio account and 1Password tool diagnostics completed. No vault items or credentials were synchronized.' >> "$GITHUB_STEP_SUMMARY"
          fi
